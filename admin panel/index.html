<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP.CO | Магазин + Админка</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-primary: #f6f9fc;
            --bg-secondary: #edf2f7;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-light: #e2e8f0;
            --border-lighter: #f1f5f9;
            --accent: #3b82f6;
            --accent-dark: #1e293b;
            --danger: #ef4444;
            --shadow: rgba(0,0,0,0.07);
            --shadow-hover: rgba(0,0,0,0.15);
            --badge-bg: #fef3c7;
            --badge-text: #b45309;
            --input-bg: #fafcff;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-light: #334155;
            --border-lighter: #1e293b;
            --accent: #60a5fa;
            --accent-dark: #3b82f6;
            --danger: #f87171;
            --shadow: rgba(0,0,0,0.3);
            --shadow-hover: rgba(0,0,0,0.5);
            --badge-bg: #451a03;
            --badge-text: #fbbf24;
            --input-bg: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease;
        }

        body {
            background: linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            padding: 24px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .theme-toggle i {
            font-size: 20px;
            padding: 6px 10px;
            border-radius: 30px;
            color: var(--text-secondary);
        }

        .theme-toggle .active-theme {
            background: var(--accent);
            color: white;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: var(--bg-card);
            padding: 6px;
            border-radius: 60px;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .nav-btn {
            padding: 12px 28px;
            border: none;
            background: transparent;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .nav-btn i {
            margin-right: 8px;
        }

        .nav-btn.active {
            background: var(--accent-dark);
            color: white;
            box-shadow: 0 8px 16px -6px var(--shadow);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 40px;
            box-shadow: 0 4px 12px var(--shadow);
            font-weight: 600;
            color: var(--text-primary);
        }

        .cart-count {
            background: var(--danger);
            color: white;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 14px;
            margin-left: 8px;
        }

        /* ===== SHOP VIEW ===== */
        .shop-view, .admin-view {
            display: none;
        }

        .shop-view.active, .admin-view.active {
            display: block;
        }

        .categories {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 10px 22px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-primary);
        }

        .category-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px -8px var(--shadow);
            transition: transform 0.25s, box-shadow 0.25s;
            border: 1px solid var(--border-lighter);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 28px 40px -12px var(--shadow-hover);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 16px;
            background: var(--bg-secondary);
        }

        .product-badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            width: fit-content;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .product-desc {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .product-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .add-to-cart-btn {
            background: var(--accent-dark);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-to-cart-btn:hover {
            background: var(--accent);
            transform: scale(1.05);
        }

        /* ===== CART ===== */
        .cart-section {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 20px 35px -8px var(--shadow);
            margin-top: 20px;
        }

        .cart-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
        }

        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-lighter);
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .cart-item-img {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            object-fit: cover;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .cart-item-price {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            padding: 6px 12px;
            border-radius: 30px;
        }

        .quantity-btn {
            background: none;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 20px;
            color: var(--accent);
        }

        .remove-btn {
            color: var(--danger);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        .cart-summary {
            margin-top: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-price {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .checkout-btn {
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            color: white;
            border: none;
            padding: 18px 42px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px var(--shadow);
        }

        /* ===== ADMIN PANEL ===== */
        .admin-header {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stats-card {
            background: var(--bg-card);
            padding: 24px 32px;
            border-radius: 24px;
            box-shadow: 0 8px 20px var(--shadow);
            flex: 1;
            min-width: 180px;
        }

        .stats-label {
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stats-value {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .admin-panel {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
        }

        .admin-card {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 20px 35px -8px var(--shadow);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid var(--border-light);
            border-radius: 18px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }

        .admin-table th {
            text-align: left;
            padding: 12px 0;
            color: var(--text-secondary);
            font-weight: 500;
            border-bottom: 2px solid var(--border-lighter);
        }

        .admin-table td {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-lighter);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--accent-dark);
            color: white;
            border: none;
            padding: 14px 26px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
        }

        .order-item {
            background: var(--bg-secondary);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--border-lighter); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 10px; }

        @media (max-width: 768px) {
            .admin-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <div class="logo"><i class="fas fa-bolt" style="margin-right: 8px; color: var(--accent);"></i>SHOP.CO</div>
            <div class="theme-toggle" onclick="toggleTheme()">
                <i class="fas fa-sun" id="lightIcon"></i>
                <i class="fas fa-moon" id="darkIcon"></i>
            </div>
        </div>
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchView('shop')"><i class="fas fa-store"></i>Магазин</button>
            <button class="nav-btn" onclick="switchView('admin')"><i class="fas fa-cog"></i>Админка</button>
        </div>
        <div class="cart-icon" onclick="document.querySelector('.cart-section').scrollIntoView({behavior: 'smooth'})">
            <i class="fas fa-shopping-bag"></i> Корзина <span class="cart-count" id="cartCount">0</span>
        </div>
    </div>

    <!-- МАГАЗИН -->
    <div id="shopView" class="shop-view active">
        <div class="categories" id="categoryFilters"></div>
        <div class="products-grid" id="productsContainer"></div>
        
        <div class="cart-section">
            <div class="cart-title"><i class="fas fa-shopping-bag"></i> Ваша корзина</div>
            <div class="cart-items" id="cartItemsContainer"></div>
            <div class="cart-summary">
                <span class="total-price" id="totalPrice">0 ₽</span>
                <button class="checkout-btn" onclick="checkout()"><i class="fas fa-check" style="margin-right: 8px;"></i>Оформить заказ</button>
            </div>
        </div>
    </div>

    <!-- АДМИНКА -->
    <div id="adminView" class="admin-view">
        <div class="admin-header">
            <div class="stats-card"><div class="stats-label">Товаров</div><div class="stats-value" id="totalProducts">0</div></div>
            <div class="stats-card"><div class="stats-label">Заказов</div><div class="stats-value" id="totalOrders">0</div></div>
            <div class="stats-card"><div class="stats-label">Выручка</div><div class="stats-value" id="totalRevenue">0 ₽</div></div>
        </div>
        <div class="admin-panel">
            <div class="admin-card">
                <h3 style="margin-bottom: 24px; color: var(--text-primary);"><i class="fas fa-plus-circle" style="color: var(--accent);"></i> Добавить товар</h3>
                <div class="form-group"><label>Название</label><input class="form-control" id="prodName" placeholder="Nike Air Max"></div>
                <div class="form-group"><label>Категория</label><input class="form-control" id="prodCat" placeholder="Кроссовки"></div>
                <div class="form-group"><label>Цена (₽)</label><input class="form-control" type="number" id="prodPrice" placeholder="12990"></div>
                <div class="form-group"><label>Описание</label><input class="form-control" id="prodDesc" placeholder="Удобные и стильные..."></div>
                <div class="form-group"><label>URL картинки</label><input class="form-control" id="prodImage" placeholder="https://..."></div>
                <button class="btn-primary" onclick="addProduct()"><i class="fas fa-save"></i> Сохранить товар</button>
            </div>
            <div class="admin-card">
                <h3 style="margin-bottom: 24px; color: var(--text-primary);"><i class="fas fa-box"></i> Управление товарами</h3>
                <div style="max-height: 400px; overflow-y: auto; padding-right: 4px;">
                    <table class="admin-table" id="adminProductsTable"></table>
                </div>
                <h3 style="margin: 30px 0 16px; color: var(--text-primary);"><i class="fas fa-clipboard-list"></i> Последние заказы</h3>
                <div id="adminOrdersList"></div>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ===== ТЕМА =====
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        
        window.toggleTheme = function() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcons();
        };

        function updateThemeIcons() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('lightIcon').className = theme === 'light' ? 'fas fa-sun active-theme' : 'fas fa-sun';
            document.getElementById('darkIcon').className = theme === 'dark' ? 'fas fa-moon active-theme' : 'fas fa-moon';
        }
        updateThemeIcons();

        // ===== ДАННЫЕ =====
        let products = JSON.parse(localStorage.getItem('sleek_products_v2')) || [
            // Кроссовки
            { id: 'p1', name: 'Nike Air Max 90', category: 'Кроссовки', price: 11990, desc: 'Легендарная амортизация', image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80' },
            { id: 'p2', name: 'Adidas Ultraboost', category: 'Кроссовки', price: 13990, desc: 'Энергия в каждом шаге', image: 'https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=400&q=80' },
            { id: 'p3', name: 'New Balance 574', category: 'Кроссовки', price: 8990, desc: 'Классика комфорта', image: 'https://images.unsplash.com/photo-1539185442499-8794739d6e5c?w=400&q=80' },
            { id: 'p4', name: 'Puma RS-X', category: 'Кроссовки', price: 7990, desc: 'Футуристичный дизайн', image: 'https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=400&q=80' },
            { id: 'p5', name: 'Reebok Classic', category: 'Кроссовки', price: 6490, desc: 'Вечная классика', image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80' },
            // Одежда
            { id: 'p6', name: 'Худи Oversize', category: 'Одежда', price: 4290, desc: '100% хлопок, свободный крой', image: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400&q=80' },
            { id: 'p7', name: 'Джинсы Slim Fit', category: 'Одежда', price: 5490, desc: 'Стрейч, зауженный крой', image: 'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=400&q=80' },
            { id: 'p8', name: 'Футболка базовая', category: 'Одежда', price: 1490, desc: 'Премиум хлопок', image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&q=80' },
            { id: 'p9', name: 'Куртка бомбер', category: 'Одежда', price: 8990, desc: 'Ветрозащитная ткань', image: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400&q=80' },
            { id: 'p10', name: 'Спортивные штаны', category: 'Одежда', price: 2990, desc: 'Для тренировок и отдыха', image: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400&q=80' },
            // Электроника
            { id: 'p11', name: 'Apple Watch SE', category: 'Электроника', price: 24990, desc: 'GPS + Cellular', image: 'https://images.unsplash.com/photo-1579586337278-3befd40fd17a?w=400&q=80' },
            { id: 'p12', name: 'AirPods Pro 2', category: 'Электроника', price: 21990, desc: 'Активное шумоподавление', image: 'https://images.unsplash.com/photo-1588423771073-b8903fbb85b5?w=400&q=80' },
            { id: 'p13', name: 'Samsung Galaxy Buds', category: 'Электроника', price: 9990, desc: 'Качественный звук', image: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400&q=80' },
            { id: 'p14', name: 'Портативная колонка JBL', category: 'Электроника', price: 7990, desc: 'Влагозащита IP67', image: 'https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400&q=80' },
            { id: 'p15', name: 'Power Bank 20000mAh', category: 'Электроника', price: 3490, desc: 'Быстрая зарядка', image: 'https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=400&q=80' },
            // Аксессуары
            { id: 'p16', name: 'Рюкзак Urban', category: 'Аксессуары', price: 3490, desc: 'Водонепроницаемый', image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&q=80' },
            { id: 'p17', name: 'Солнцезащитные очки', category: 'Аксессуары', price: 2490, desc: 'UV400 защита', image: 'https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&q=80' },
            { id: 'p18', name: 'Часы Casio Vintage', category: 'Аксессуары', price: 4490, desc: 'Ретро дизайн', image: 'https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=400&q=80' },
            { id: 'p19', name: 'Ремень кожаный', category: 'Аксессуары', price: 1990, desc: 'Натуральная кожа', image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&q=80' },
            { id: 'p20', name: 'Кепка бейсболка', category: 'Аксессуары', price: 1290, desc: 'Регулируемый размер', image: 'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400&q=80' },
            // Новинки
            { id: 'p21', name: 'Фитнес-браслет Xiaomi', category: 'Электроника', price: 3990, desc: 'Мониторинг здоровья', image: 'https://images.unsplash.com/photo-1575311373937-040b8e1fd5b5?w=400&q=80' },
            { id: 'p22', name: 'Шорты спортивные', category: 'Одежда', price: 1990, desc: 'Дышащая ткань', image: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400&q=80' }
        ];

        let cart = JSON.parse(localStorage.getItem('sleek_cart_v2')) || [];
        let orders = JSON.parse(localStorage.getItem('sleek_orders_v2')) || [];

        // ===== ВСПОМОГАТЕЛЬНЫЕ =====
        function saveAll() {
            localStorage.setItem('sleek_products_v2', JSON.stringify(products));
            localStorage.setItem('sleek_cart_v2', JSON.stringify(cart));
            localStorage.setItem('sleek_orders_v2', JSON.stringify(orders));
        }

        function formatPrice(p) { return p.toLocaleString() + ' ₽'; }

        // ===== МАГАЗИН =====
        function renderShop() {
            const cats = [...new Set(products.map(p => p.category))];
            const catContainer = document.getElementById('categoryFilters');
            catContainer.innerHTML = `<button class="category-btn active" onclick="filterCategory('all')">Все (${products.length})</button>` +
                cats.map(c => `<button class="category-btn" onclick="filterCategory('${c}')">${c}</button>`).join('');
            
            renderProducts(products);
            renderCart();
        }

        window.filterCategory = function(cat) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
            renderProducts(filtered);
        };

        function renderProducts(list) {
            const grid = document.getElementById('productsContainer');
            if (list.length === 0) {
                grid.innerHTML = '<div class="empty-state">Товары не найдены</div>';
                return;
            }
            grid.innerHTML = list.map(p => `
                <div class="product-card">
                    <span class="product-badge">${p.category}</span>
                    <img class="product-image" src="${p.image}" alt="${p.name}" onerror="this.src='https://placehold.co/400x300/1e293b/94a3b8?text=No+image'">
                    <div class="product-title">${p.name}</div>
                    <div class="product-desc">${p.desc}</div>
                    <div class="product-footer">
                        <span class="product-price">${formatPrice(p.price)}</span>
                        <button class="add-to-cart-btn" onclick="addToCart('${p.id}')"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
            `).join('');
        }

        window.addToCart = function(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(i => i.id === id);
            if (existing) existing.quantity++; else cart.push({ ...product, quantity: 1 });
            saveAll(); renderCart(); updateCartCount();
        };

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-bag-shopping" style="font-size: 40px;"></i><br>Корзина пуста</div>';
                document.getElementById('totalPrice').innerText = '0 ₽';
                return;
            }
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <img class="cart-item-img" src="${item.image}" onerror="this.src='https://placehold.co/60'">
                        <div><div class="cart-item-name">${item.name}</div><div class="cart-item-price">${formatPrice(item.price)}</div></div>
                    </div>
                    <div class="cart-item-actions">
                        <div class="quantity-control">
                            <button class="quantity-btn" onclick="updateQuantity('${item.id}', -1)">−</button>
                            <span>${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateQuantity('${item.id}', 1)">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart('${item.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
            const total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            document.getElementById('totalPrice').innerText = formatPrice(total);
            updateCartCount();
        }

        window.updateQuantity = (id, delta) => {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
            saveAll(); renderCart();
        };

        window.removeFromCart = (id) => { cart = cart.filter(i => i.id !== id); saveAll(); renderCart(); };
        function updateCartCount() { document.getElementById('cartCount').innerText = cart.reduce((s,i) => s + i.quantity, 0); }

        window.checkout = function() {
            if (cart.length === 0) { alert('Корзина пуста'); return; }
            const total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            const order = { id: 'ORD-' + Date.now(), date: new Date().toLocaleString(), items: [...cart], total };
            orders.push(order);
            cart = [];
            saveAll();
            renderCart();
            renderAdminStats();
            alert(`✅ Заказ оформлен! Сумма: ${formatPrice(total)}`);
        };

        // ===== АДМИНКА =====
        function renderAdmin() {
            renderAdminStats();
            renderAdminProductsTable();
            renderOrdersList();
        }

        function renderAdminStats() {
            document.getElementById('totalProducts').innerText = products.length;
            document.getElementById('totalOrders').innerText = orders.length;
            const revenue = orders.reduce((s,o) => s + o.total, 0);
            document.getElementById('totalRevenue').innerText = formatPrice(revenue);
        }

        function renderAdminProductsTable() {
            const tbody = document.getElementById('adminProductsTable');
            tbody.innerHTML = `
                <tr><th>Товар</th><th>Цена</th><th></th></tr>
                ${products.map(p => `
                    <tr>
                        <td><b>${p.name}</b><br><span style="font-size:13px;color:var(--text-secondary);">${p.category}</span></td>
                        <td>${formatPrice(p.price)}</td>
                        <td><button class="btn-icon" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button></td>
                    </tr>
                `).join('')}
            `;
        }

        window.deleteProduct = (id) => {
            products = products.filter(p => p.id !== id);
            saveAll(); renderAdmin(); renderShop();
        };

        function renderOrdersList() {
            const container = document.getElementById('adminOrdersList');
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-state">Пока нет заказов</div>';
                return;
            }
            container.innerHTML = orders.slice(-5).reverse().map(o => `
                <div class="order-item">
                    <div style="display:flex; justify-content:space-between;"><b>${o.id}</b> <span>${o.date}</span></div>
                    <div>${o.items.length} товаров · ${formatPrice(o.total)}</div>
                </div>
            `).join('');
        }

        window.addProduct = function() {
            const name = document.getElementById('prodName').value.trim();
            const cat = document.getElementById('prodCat').value.trim();
            const price = parseInt(document.getElementById('prodPrice').value);
            const desc = document.getElementById('prodDesc').value.trim();
            const image = document.getElementById('prodImage').value.trim();
            if (!name || !cat || !price) { alert('Заполните название, категорию и цену'); return; }
            const newProduct = {
                id: 'p' + Date.now() + Math.random().toString(36),
                name, category: cat, price, desc: desc || 'Без описания',
                image: image || 'https://placehold.co/400x300/1e293b/94a3b8?text=No+image'
            };
            products.push(newProduct);
            saveAll();
            ['prodName','prodCat','prodPrice','prodDesc','prodImage'].forEach(id => document.getElementById(id).value = '');
            renderAdmin(); renderShop();
        };

        window.switchView = function(view) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('shopView').classList.toggle('active', view === 'shop');
            document.getElementById('adminView').classList.toggle('active', view === 'admin');
            if (view === 'admin') renderAdmin(); else renderShop();
        };

        // Инициализация
        renderShop();
        updateCartCount();
    })();
</script>
</body>
</html>
